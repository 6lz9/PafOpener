# Construit PafOpener.app sur les machines macOS de GitHub (PyInstaller ne sait pas compiler pour Mac depuis
# Windows). Lancement : onglet « Actions » du dépôt → « Build Mac » → « Run workflow ».
# Résultat : en bas de la page du run, « PafOpener-mac-apple-silicon » (Mac M1 à M4) et « PafOpener-mac-intel ».
name: Build Mac

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # puce Apple (arm64)
            nom: apple-silicon
          - runner: macos-15-intel    # Intel (x86_64)
            nom: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt certifi pyinstaller==6.22.3

      - name: Tests
        run: python -m pytest

      - name: Construction de PafOpener.app
        run: |
          python -m PyInstaller --noconfirm --windowed --name PafOpener \
            --osx-bundle-identifier com.pafopener.app \
            --icon assets/logo.png \
            --add-data "assets/logo.png:assets" \
            --collect-data customtkinter --collect-all playwright \
            main.py

      # ditto garde les liens et les droits d'exécution du .app (un zip ordinaire casserait l'application).
      - name: Archive
        run: |
          mkdir -p livraison
          ditto -c -k --keepParent dist/PafOpener.app livraison/PafOpener.zip
          cp mac/LISEZ-MOI.txt livraison/

      - uses: actions/upload-artifact@v4
        with:
          name: PafOpener-mac-${{ matrix.nom }}
          path: livraison/
